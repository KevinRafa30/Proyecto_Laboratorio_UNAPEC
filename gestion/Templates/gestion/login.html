<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso al Sistema - UNAPEC</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #f0f4f8; /* Fondo gris/azulado claro */
            font-family: system-ui, -apple-system, sans-serif;
        }
        .login-card {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            width: 100%;
            max-width: 380px;
            text-align: center;
        }
        .logo {
            width: 60px;
            height: 60px;
            background-color: #1e3a8a; /* Azul UNAPEC */
            color: white;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            font-weight: bold;
            margin: 0 auto 20px auto;
        }
        .login-title { margin: 0 0 5px 0; color: #111827; font-size: 24px; }
        .login-subtitle { margin: 0 0 25px 0; color: #6b7280; font-size: 14px; }
        
        .form-group { text-align: left; margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; color: #374151; font-weight: 500; font-size: 14px; }
        
        /* Estilizamos los inputs por defecto de Django */
        input[type="text"], input[type="password"] {
            width: 100%; padding: 12px; border: 1px solid #d1d5db; 
            border-radius: 6px; box-sizing: border-box; font-size: 14px;
        }
        input[type="text"]:focus, input[type="password"]:focus {
            outline: none; border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37,99,235,0.1);
        }
        
        .btn-submit {
            width: 100%; padding: 12px; background-color: #1e3a8a; color: white;
            border: none; border-radius: 6px; font-weight: bold; font-size: 15px;
            cursor: pointer; margin-top: 10px; transition: background 0.2s;
        }
        .btn-submit:hover { background-color: #1e40af; }
        
        .error-msg { color: #dc2626; background: #fee2e2; padding: 10px; border-radius: 6px; font-size: 13px; margin-bottom: 15px;}
    </style>
</head>
<body>

    <div class="login-card">
        <div class="logo">U</div>
        <h1 class="login-title">UNAPEC Labs</h1>
        <p class="login-subtitle">Gestión de Laboratorios e Infraestructura</p>

        <form method="POST">
            {% csrf_token %}
            
            {% if form.errors %}
                <div class="error-msg">⚠️ Usuario o contraseña incorrectos.</div>
            {% endif %}

            <div class="form-group">
                <label>Nombre de Usuario</label>
                {{ form.username }}
            </div>
            
            <div class="form-group">
                <label>Contraseña</label>
                {{ form.password }}
            </div>

            <button type="submit" class="btn-submit">Ingresar al Sistema</button>
        </form>
    </div>

</body>
</html>
